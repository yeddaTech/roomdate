<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <!-- Tema chiaro o scuro prima del primo disegno (file a parte: la CSP vieta gli script inline) -->
    <script src="/theme.js"></script>
    <!-- Qui il plugin "boot" di vite.config.js aggiunge src/boot.ts: dati e foto della pagina chiesti
         subito, mentre l'app si scarica ancora (src/api/early.ts) -->

    <!-- Titolo per chi non esegue JavaScript; poi ogni pagina mette titolo, descrizione, indirizzo
         canonico e, se privata, noindex (src/components/PageMeta.tsx) -->
    <title>RoomDate — Stanze in affitto e coinquilini</title>
    <meta name="google-site-verification" content="9F81C9YLmIK7AZ5CilHQPIDPTdA_BNFKkfsdcFG6ijw" />

    <!-- Anteprima dei link condivisi: i programmi di social e chat non eseguono JavaScript. Per gli
         annunci l'anteprima con titolo, prezzo e foto la fa il server (vercel.json, internal/seo) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoomDate" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="RoomDate — Stanze in affitto e coinquilini" />
    <meta property="og:description" content="Cerca stanze in affitto e coinquilini e scrivi direttamente a chi ti interessa, in una chat cifrata." />
    <meta property="og:image" content="https://roomdate.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RoomDate: stanze in affitto e coinquilini" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- App installabile (modulo M2.8): nome, icone e colori in public/manifest.webmanifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="RoomDate" />

    <!-- Dati strutturati: il sito e chi lo pubblica -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://roomdate.vercel.app/#sito",
            "name": "RoomDate",
            "url": "https://roomdate.vercel.app/",
            "inLanguage": "it-IT",
            "description": "Stanze in affitto e coinquilini in Italia, con contatto diretto in una chat cifrata.",
            "publisher": { "@id": "https://roomdate.vercel.app/#organizzazione" }
          },
          {
            "@type": "Organization",
            "@id": "https://roomdate.vercel.app/#organizzazione",
            "name": "RoomDate",
            "url": "https://roomdate.vercel.app/",
            "logo": "https://roomdate.vercel.app/icons/icon-512.png"
          }
        ]
      }
    </script>
    <!-- Senza JavaScript la rotella di caricamento girerebbe per sempre: al suo posto un avviso -->
    <noscript><style>.roomdate-loader-container { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root">
      <!-- INIZIO LOADER PRE-REACT -->
      <style>
        body { margin: 0; background-color: #FAFAFA; }
        /* Stessi colori del tema scuro (src/index.css): public/theme.js mette .dark prima di questo punto */
        .dark body { background-color: #1c1824; }
        .dark .roomdate-spinner { border-color: #3f374b; border-top-color: #fb923c; }
        .dark .roomdate-logo { color: #f4eee8; }
        .dark .roomdate-logo span { color: #fb923c; }
        .roomdate-loader-container { 
          display: flex; flex-direction: column; align-items: center; justify-content: center; 
          height: 100vh; width: 100vw; font-family: system-ui, sans-serif; 
        }
        .roomdate-spinner { 
          width: 50px; height: 50px; border: 4px solid #f3e8e0; border-top: 4px solid #F97316; 
          border-radius: 50%; animation: roomdate-spin 1s linear infinite; margin-bottom: 20px; 
        }
        .roomdate-logo { font-size: 26px; font-weight: 800; color: #171717; letter-spacing: -0.5px; font-family: Georgia, serif; }
        .roomdate-logo span { color: #F97316; }
        .roomdate-noscript { max-width: 36rem; margin: 15vh auto; padding: 0 1rem; font-family: system-ui, sans-serif; color: #1c1917; line-height: 1.5; }
        @keyframes roomdate-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      
      <div class="roomdate-loader-container">
        <div class="roomdate-spinner"></div>
        <div class="roomdate-logo">Room<span>Date</span></div>
      </div>
      <!-- FINE LOADER -->
    </div>
    <noscript>
      <main class="roomdate-noscript">
        <h1>RoomDate</h1>
        <p>Stanze in affitto e coinquilini, con contatto diretto in una chat cifrata. Per usare il sito attiva JavaScript nel browser.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
