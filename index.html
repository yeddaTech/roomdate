<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    
    <!-- SEO Standard Principale -->
    <title>Roomdate — Trova Coinquilini e Stanze in Affitto</title>
    <meta name="description" content="La piattaforma smart per cercare stanze in affitto e trovare il coinquilino ideale. Filtra gli annunci, chatta in tempo reale e trova la tua sistemazione." />
    <meta name="keywords" content="cercare coinquilino, stanze in affitto, affitto studenti, posto letto, coinquilini milano, roomshare" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="9F81C9YLmIK7AZ5CilHQPIDPTdA_BNFKkfsdcFG6ijw" />
    
    <!-- Open Graph (Per la condivisione sui social e anteprime nelle chat/AI) -->
    <meta property="og:title" content="Roomdate — Trova Coinquilini e Stanze in Affitto" />
    <meta property="og:description" content="Cerca stanze in affitto e coinquilini e contatta direttamente gli altri utenti in chat." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roomdate.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roomdate — Trova Coinquilini e Stanze in Affitto" />
    <meta name="twitter:description" content="La piattaforma per trovare la stanza ideale e il coinquilino perfetto." />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Dati Strutturati di Base (Schema.org per l'AIO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Roomdate",
        "url": "https://roomdate.vercel.app/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "Applicazione web per la ricerca di coinquilini e stanze in affitto.",
        "offers": {
          "@type": "Offer",
          "price": "0"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- INIZIO LOADER PRE-REACT -->
      <style>
        body { margin: 0; background-color: #FAFAFA; }
        .roomdate-loader-container { 
          display: flex; flex-direction: column; align-items: center; justify-content: center; 
          height: 100vh; width: 100vw; font-family: system-ui, sans-serif; 
        }
        .roomdate-spinner { 
          width: 50px; height: 50px; border: 4px solid #f3e8e0; border-top: 4px solid #F97316; 
          border-radius: 50%; animation: roomdate-spin 1s linear infinite; margin-bottom: 20px; 
        }
        .roomdate-logo { font-size: 26px; font-weight: 800; color: #171717; letter-spacing: -0.5px; font-family: Georgia, serif; }
        .roomdate-logo span { color: #F97316; }
        @keyframes roomdate-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      
      <div class="roomdate-loader-container">
        <div class="roomdate-spinner"></div>
        <div class="roomdate-logo">Room<span>Date</span></div>
      </div>
      <!-- FINE LOADER -->

      <!-- CONTENUTO SEO ORIGINALE (Verrà eliminato insieme al loader appena React monta l'app) -->
      <header style="display:none;">
        <h1>Roomdate</h1>
        <nav>
          <a href="/">Home</a>
          <a href="/ricerca">Annunci</a>
        </nav>
      </header>
      <main style="display:none;">
        <h2>Trova la tua stanza e il tuo coinquilino ideale</h2>
        <p>Roomdate ti permette di cercare stanze, posti letto e appartamenti in condivisione, mettendoti in contatto diretto con potenziali coinquilini tramite una chat dedicata.</p>
      </main>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
